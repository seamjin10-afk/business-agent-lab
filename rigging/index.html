<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>워해머 v55 · 리깅 검수</title><style>body{background:#171719;color:#eee4d4;font-family:system-ui;margin:24px}main{max-width:1400px;margin:auto}h1{font-size:24px}a{color:#d8b77c}button,select{background:#302a25;color:inherit;border:1px solid #8a6943;padding:9px;margin:4px;border-radius:4px}button.active{background:#8a6943}.stage{display:flex;gap:15px;flex-wrap:wrap}canvas{background:#24211e;border:1px solid #50422e;max-width:100%;height:auto}#stage{width:720px}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.cards canvas{width:100%}figure{margin:0}figcaption{font-size:12px;text-align:center;color:#cfb68a}#info{font-size:12px;max-width:600px}label{font-size:13px}@media(max-width:700px){body{margin:10px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><main><h1>워해머 v55 · 전체 캐릭터 리깅</h1><p>리깅 원본 검수 · 14개 골격 / 각 12개 동작</p><div><select id="character"></select><button id="play">일시 정지</button><button id="bones">관절 표시</button><button id="flip">좌우 반전</button><label>시간 <input id="seek" type="range" min="0" max="1000" value="0"></label></div><div id="poses"></div><div class="stage"><canvas id="stage" width="1000" height="800"></canvas><div id="info"></div></div><h2 style="font-size:18px">범용·기승형 10세트</h2><div class="cards" id="cards"></div></main><script src="rig-bundle.js"></script><script src="runtime.js"></script><script>
const R=WFRPRig,keys=WFRP_RIG_BUNDLE.poses,primary=[...R.rigs.keys()].filter(id=>!id.endsWith('on-foot'));let id='human',pose='combat',t=0,playing=true,guides=false,flip=false,last=0;for(const [k,v]of R.rigs){const o=document.createElement('option');o.value=k;o.textContent=v.name;document.querySelector('#character').append(o)}for(const p of keys){const b=document.createElement('button');b.textContent=({'combat':'대기','attack':'공격','skill':'기술','hurt':'피격','down':'쓰러짐','walk':'걷기','camp':'야영','victory':'승리','heroic':'각성','afflicted':'정신적 위기','defend':'방어','investigate':'조사'})[p];b.dataset.pose=p;b.onclick=()=>{pose=p;t=0;paint()};document.querySelector('#poses').append(b)}for(const k of primary){const f=document.createElement('figure'),c=document.createElement('canvas'),cap=document.createElement('figcaption');c.width=400;c.height=400;c.dataset.preview=k;cap.textContent=R.rigs.get(k).name;f.append(c,cap);document.querySelector('#cards').append(f)}
function paint(){if(!window.ready)return;const rig=R.rigs.get(id);R.draw(document.querySelector('#stage'),id,pose,t,{guides,flip,background:'#24211e'});document.querySelectorAll('[data-pose]').forEach(b=>b.classList.toggle('active',b.dataset.pose===pose));document.querySelector('#info').innerHTML=`<h2>${rig.name}</h2><p>${rig.bones.length}개 본 · ${rig.slots.length}개 부품 · 12개 동작</p><p>${pose} · ${t.toFixed(2)}초</p><p><a download href="${id}/${id}.skel">.skel</a> · <a download href="${id}/${id}.json">JSON</a> · <a download href="${id}/${id}.atlas">atlas</a></p><p>보행은 두 관절 IK를 키프레임으로 구워 발바닥을 수평으로 유지합니다. 기수 골격은 안장 위치에 연결됩니다.</p>`;for(const c of document.querySelectorAll('[data-preview]'))R.draw(c,c.dataset.preview,pose,t%R.rigs.get(c.dataset.preview).durations[pose]);document.querySelector('#seek').value=t/rig.durations[pose]*1000}
document.querySelector('#character').onchange=e=>{id=e.target.value;t=0;paint()};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'일시 정지':'재생'};document.querySelector('#bones').onclick=()=>{guides=!guides;paint()};document.querySelector('#flip').onclick=()=>{flip=!flip;paint()};document.querySelector('#seek').oninput=e=>{playing=false;t=Number(e.target.value)/1000*R.rigs.get(id).durations[pose];paint()};function frame(now){if(window.ready&&playing){if(last)t=(t+(now-last)/1000)%R.rigs.get(id).durations[pose];paint()}last=now;requestAnimationFrame(frame)}R.ready.then(()=>{window.ready=true;paint();requestAnimationFrame(frame)});window.RIG_VIEW={set:(k,p,tt)=>{id=k;pose=p;t=tt;playing=false;document.querySelector('#character').value=k;paint()},get:()=>({id,pose,t}),paint};
</script></html>
