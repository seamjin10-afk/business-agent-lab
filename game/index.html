<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Old World Tactics</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#121016;--panel:#1d1a24;--line:#3a3446;--text:#eee8dc;--muted:#a49c90;--ally:#5aa0ff;--enemy:#ff5a5a;--gold:#d5b878}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px}
  button,select{font:inherit;color:var(--text);background:#2a2533;border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
  button:hover:not(:disabled){background:#3a3346}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:#8e2f3a;border-color:#8e2f3a}
  button.sel{outline:2px solid var(--gold)}
  button.quiet{background:transparent}
  .app{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr) auto;height:100%;gap:8px;padding:8px}
  #hud-setup{grid-column:1/3;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:8px 10px;border-radius:6px}
  #hud-setup label{display:flex;gap:6px;align-items:center;color:var(--muted)}
  #board{position:relative;min-height:0;background:#0b0a0e;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  #board canvas{image-rendering:pixelated}
  .side{grid-row:2/4;grid-column:2;display:flex;flex-direction:column;gap:8px;min-height:0}
  #hud-order,#hud-log{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
  #hud-order h3{margin:0 0 6px;font-size:13px;color:var(--gold)}
  .ord{display:grid;grid-template-columns:1fr 70px 44px;gap:6px;align-items:center;padding:2px 4px;border-left:3px solid transparent}
  .ord.allies{border-left-color:var(--ally)}.ord.enemies{border-left-color:var(--enemy)}
  .ord.now{background:#352e40}.ord.dead{opacity:.4;text-decoration:line-through}
  .ord small{color:var(--muted);text-align:right}
  #hud-log{flex:1;overflow-y:auto;font-size:12.5px;line-height:1.5}
  .entry.allies{color:#bcd6ff}.entry.enemies{color:#ffc4c4}.entry.dice{color:var(--muted)}
  .entry.dmg{color:#ff8a8a}.entry.heal{color:#8aff9a}.entry.death{color:#fff;font-weight:bold}.entry.round{color:var(--gold);margin-top:4px}
  #hud-actions{grid-column:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:64px}
  #hud-actions .btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .hint{color:var(--muted);margin:2px 0}.err{color:#ff8a8a;margin:2px 0}
  #hud-result{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:10}
  #hud-result[hidden]{display:none}
  #hud-result .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 22px;min-width:min(520px,92vw)}
  #hud-result h2{margin:0;font-size:28px}.win{color:var(--gold)}.lose{color:var(--enemy)}
  #hud-result table{width:100%;border-collapse:collapse;margin:10px 0}
  #hud-result td,#hud-result th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
  #hud-result tr.allies td:first-child{color:#bcd6ff}#hud-result tr.enemies td:first-child{color:#ffc4c4}
  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 56vw auto auto;height:auto}
    #hud-setup,.side,#hud-actions{grid-column:1}.side{grid-row:auto}#hud-log{max-height:40vh}
  }
</style>
</head>
<body>
<div class="app">
  <div id="hud-setup"></div>
  <div id="board"></div>
  <div class="side"><div id="hud-order"></div><div id="hud-log"></div></div>
  <div id="hud-actions"></div>
</div>
<div id="hud-result" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
