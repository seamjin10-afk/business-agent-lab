<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Branch Tale</title>
<style>
  html,body{margin:0;height:100%;background:#0e0b14;color:#eee;font-family:"DotGothic16","Courier New",monospace}
  #game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #game canvas{image-rendering:pixelated}
  #dialogue{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(720px,94vw);
    background:#1b1530ee;border:3px solid #e8d9a8;padding:12px 16px;display:none;box-sizing:border-box;font-size:16px;line-height:1.5}
  #dialogue .speaker{color:#ffd166;margin-bottom:4px}
  #dialogue .log{color:#9ad1ff;font-size:14px}
  #dialogue button{display:block;width:100%;text-align:left;margin-top:6px;padding:6px 10px;background:#2a2150;
    color:#fff;border:2px solid #6c5ce7;font:inherit;cursor:pointer}
  #dialogue button:hover,#dialogue button:focus{background:#4b3fa0;outline:none}
  #hud{position:fixed;left:8px;top:8px;font-size:13px;background:#000a;padding:4px 8px;border:1px solid #555}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">방향키/WASD 이동 · Space/E 대화 · 1~9 선택</div>
<div id="dialogue"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
